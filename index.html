<script>
/* =====================================================================
   1) SCRIPT — le seul bloc à réécrire pour un nouvel épisode.

const SCRIPT = {

             code:["si oreilles_pointues(img)","  et moustaches(img) :","    réponse = « chat »","sinon si …","# et un chat de dos ?","# et un chat flou ?"] } },
    { id:"P6", act:3, start:20.0, end:24.0, visual:"plot", step:0,
      text:"Étape 1 : les données. Des exemples, avec la bonne réponse." },
    { id:"P7", act:3, start:24.0, end:29.0, visual:"plot", step:1,

    { id:"P9", act:3, start:34.0, end:38.0, visual:"valley",
      text:"C'est tout. Pas de magie : une descente, pas à pas, vers moins d'erreur." },

      text:"Un modèle de langage fait pareil, sur un seul jeu : deviner le mot suivant.",

      text:"Elle prédit, elle ne comprend pas. Aucune intention derrière le mot.",

    { id:"P12", act:4, start:46.0, end:50.0, visual:"biasStream",

    { id:"P13", act:4, start:50.0, end:53.0, visual:"flatGuess",
      text:"Et quand elle ne sait pas, elle devine quand même. Avec aplomb.",
      data:{ prefix:"Le zorglub dort sur le", bars:[["canapé",4],["lit",4],["toit",4],["sol",4],["piano",4],["frigo",4],["nuage",4],["bus",4]],
             pick:4, note:"… et 17 autres mots, tous à 4 %", stamp:"sans hésiter" } },
    { id:"P14", act:5, start:53.0, end:60.0, visual:"mirror",
      text:"L'IA n'est pas une intelligence. C'est un miroir statistique de ce qu'on lui a donné. La question n'est plus ce qu'elle sait, mais ce qu'on lui a montré.",
      beats:[ { at:53.0, text:"L'IA n'est pas une intelligence." },
              { at:55.0, text:"C'est un miroir statistique de ce qu'on lui a donné." },
              { at:57.0, text:"La question n'est plus ce qu'elle sait, mais ce qu'on lui a montré.", caption:false } ],
      data:{ kicker:"L'IA n'est pas une intelligence : c'est un miroir statistique.",
             line1:"La question n'est plus ce qu'elle sait,", line2:"mais ce qu'on lui a montré." } }

};

/* =====================================================================
   2) MOTEUR — générique : horloge, fonds, en-tête, sous-titres,
      fondus enchaînés entre plans, primitives de dessin, son, contrôles.
   ===================================================================== */
const W = 1920, H = 1080;
const P = SCRIPT.meta.palette;
const DUR = SCRIPT.meta.duration;
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MONO = 'ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace';
const cv = document.getElementById("cv");
const mainCtx = cv.getContext("2d");
let ctx = mainCtx;
let K = 1;

const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const seg = (v, a, b) => clamp01((v - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIn = k => k * k * k;
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c = 1.70158; return k <= 0 ? 0 : 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function mix(c1, c2, k) { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const r = Math.round(lerp(a >> 16, b >> 16, k)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, k)), bl = Math.round(lerp(a & 255, b & 255, k));
  return "#" + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1); }

// --- typographie : espaces insécables français, ajustement, révélation lettre à lettre ---
const fr = s => s.replace(/ ([:;?!»%€])/g, " $1").replace(/« /g, "« ");
function setFont(size, weight = 700, family = FONT) { ctx.font = `${weight} ${size}px ${family}`; }
function wrap(text, maxW) {
  const words = fr(text).split(" "), lines = []; let cur = "";
  for (const w of words) { const test = cur ? cur + " " + w : w;
    if (cur && ctx.measureText(test).width > maxW) { lines.push(cur); cur = w; } else cur = test; }
  if (cur) lines.push(cur); return lines;
}
function fit(text, maxW, maxLines, size, weight = 700, min = 18, family = FONT) {
  for (let s = size; s >= min; s -= 2) { setFont(s, weight, family); const l = wrap(text, maxW);
    if (l.length <= maxLines && l.every(x => ctx.measureText(x).width <= maxW)) return { lines:l, size:s }; }
  setFont(min, weight, family); return { lines:wrap(text, maxW), size:min };
}
function text(str, x, y, o = {}) {
  const fam = o.family || FONT, wt = o.weight || 700;
  const f = o.raw ? { lines:[str], size:o.size || 40 } : fit(str, o.maxW || 1600, o.maxLines || 1, o.size || 40, wt, o.min || 18, fam);
  setFont(f.size, wt, fam);
  const lh = f.size * (o.lh || 1.2), total = f.lines.length * lh; let yy = o.vcenter ? y - total / 2 : y;
  ctx.fillStyle = o.color || P.ink; ctx.textAlign = "left"; ctx.textBaseline = "top";
  const chars = o.reveal == null ? Infinity : o.reveal; let used = 0, caret = null;
  for (const l of f.lines) { const lw = ctx.measureText(l).width, lx = o.align === "center" ? x - lw / 2 : o.align === "right" ? x - lw : x;
    if (!caret) caret = { x:lx, y:yy, h:f.size };
    const n = Math.max(0, Math.min(l.length, chars - used)); used += l.length + 1;
    if (n > 0) { const part = l.slice(0, n); ctx.fillText(part, lx, yy + f.size * .08); caret = { x:lx + ctx.measureText(part).width, y:yy, h:f.size }; }
    yy += lh; }
  return { h:total, size:f.size, lines:f.lines, caret };
}

// --- primitives ---
function rr(x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function card(x, y, w, h, o = {}) {
  const r = o.r == null ? 18 : o.r, sh = o.shadow == null ? 8 : o.shadow;
  if (sh) { ctx.fillStyle = o.shadowColor || P.ink; rr(x + sh, y + sh, w, h, r); ctx.fill(); }
  ctx.fillStyle = o.fill || P.card; rr(x, y, w, h, r); ctx.fill();
  if (o.stroke !== false) { ctx.lineWidth = o.lw || 4; ctx.strokeStyle = o.stroke || P.ink; ctx.stroke(); }
}
function circle(x, y, r, fill, stroke, lw = 3) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } }
function line(x1, y1, x2, y2, color = P.ink, lw = 4) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.stroke(); }
function arrow(x1, y1, x2, y2, k = 1, color = P.ink, lw = 6) {
  if (k <= 0) return; const x = lerp(x1, x2, k), y = lerp(y1, y2, k); line(x1, y1, x, y, color, lw);
  const a = Math.atan2(y2 - y1, x2 - x1), s = 18; ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineTo(x - s * Math.cos(a - .5), y - s * Math.sin(a - .5)); ctx.moveTo(x, y);
  ctx.lineTo(x - s * Math.cos(a + .5), y - s * Math.sin(a + .5)); ctx.stroke(); }
function check(x, y, s, k, color = P.teal, lw = 9) { if (k <= 0) return; ctx.beginPath();
  const p = [[x - s * .5, y], [x - s * .12, y + s * .38], [x + s * .55, y - s * .42]];
  ctx.moveTo(p[0][0], p[0][1]); const k1 = clamp01(k * 2), k2 = clamp01(k * 2 - 1);
  ctx.lineTo(lerp(p[0][0], p[1][0], k1), lerp(p[0][1], p[1][1], k1));
  if (k2 > 0) ctx.lineTo(lerp(p[1][0], p[2][0], k2), lerp(p[1][1], p[2][1], k2));
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke(); }
// polyligne révélée sur une fraction k de sa longueur
function polyline(pts, k, color, lw) { if (k <= 0 || pts.length < 2) return;
  let L = 0; const d = []; for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); d.push(l); L += l; }
  let rem = L * k; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && rem > 0; i++) { const f = Math.min(1, rem / d[i - 1]); ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)); rem -= d[i - 1]; }
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke(); }
function withAlpha(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= Math.min(1, a); fn(); ctx.restore(); }
function popAt(lt, t0, d = .45) { return eBack(seg(lt, t0, t0 + d)); }
function scaled(cx, cy, s, fn) { if (s <= 0) return; ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); fn(); ctx.restore(); }
function glitch(x, y, w, h, amp, t) {
  const r = rng(Math.floor(t * 18) * 7919 + 13);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (let i = 0; i < 9; i++) { const sy = y + r() * h, sh = 6 + r() * 34, off = (r() - .5) * 2 * amp; const hh = Math.min(sh, y + h - sy); if (hh <= 1) continue;
    ctx.drawImage(cv, x * K, sy * K, w * K, hh * K, (x + off) * K, sy * K, w * K, hh * K); }
  ctx.restore();
  for (let i = 0; i < 5; i++) { const sy = y + r() * h; ctx.fillStyle = r() < .5 ? "rgba(215,38,61,.35)" : "rgba(46,109,180,.35)";
    ctx.fillRect(x + r() * w * .6, sy, w * (.15 + r() * .4), 3 + r() * 10); }
  ctx.fillStyle = "rgba(31,27,45,.05)"; for (let yy = y; yy < y + h; yy += 6) ctx.fillRect(x, yy, w, 2);
}
// Dessine sur un canvas hors-écran avec les mêmes helpers (échantillonnage de texte en particules)
function offscreen(fn) { const c = document.createElement("canvas"); c.width = W; c.height = H; const saved = ctx; ctx = c.getContext("2d"); fn(); ctx = saved; return c; }
function samplePixels(c, step, max) { const d = c.getContext("2d").getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) if (d[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
  if (pts.length > max) { const r = rng(3); for (let i = pts.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]]; } pts.length = max; }
  return pts; }

// --- fond papier / fond noir ---
const grain = (() => { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"); const r = rng(42);
  for (let i = 0; i < 2600; i++) { g.fillStyle = r() < .5 ? "rgba(31,27,45,.05)" : "rgba(255,255,255,.35)"; g.fillRect(r() * 256, r() * 256, 1 + r() * 2, 1 + r() * 2); }
  return c; })();
const DECO = { 2:[1720, 170, 240, "sun"], 3:[1800, 960, 300, "sun"], 4:[140, 160, 240, "soft"], 5:[960, 540, 520, "soft"] };
function background(s, t) {
  if (s.dark) { ctx.fillStyle = P.ink; ctx.fillRect(0, 0, W, H); return; }
  ctx.fillStyle = P.paper; ctx.fillRect(0, 0, W, H);
  const d = DECO[s.act]; if (d) { ctx.globalAlpha = .4; circle(d[0] + Math.sin(t * .4) * 12, d[1] + Math.cos(t * .3) * 12, d[2], P[d[3]]); ctx.globalAlpha = 1; }
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = ctx.createPattern(grain, "repeat"); ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore();

// --- en-tête, sous-titres ---
function header(s) {
  if (s.dark) return;
  setFont(26, 800); const label = `ACTE ${s.act} · ${SCRIPT.acts[s.act].toUpperCase()}`; const w = ctx.measureText(label).width + 44;
  ctx.fillStyle = P.ink; rr(56, 40, w, 54, 27); ctx.fill(); ctx.fillStyle = P.paper; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillText(label, 78, 68);
  setFont(24, 800); ctx.fillStyle = P.muted; ctx.fillText(s.id, 56 + w + 18, 68);
  setFont(26, 650); ctx.textAlign = "right"; ctx.fillText(`${SCRIPT.meta.series} · ${SCRIPT.meta.title}`, 1864, 68);
}
function beatsOf(s) { return s.beats || [{ at:s.start, text:s.text, caption:s.caption }]; }
function beatAt(s, t) { const bs = beatsOf(s); let b = bs[0], i = 0; bs.forEach((x, j) => { if (t >= x.at) { b = x; i = j; } }); return { b, i }; }
function caption(s, t) {
  const { b } = beatAt(s, t); if (b.caption === false) return;
  const bt = t - b.at, a = eOut(seg(bt, 0, .25));
  const x = 150, y = 868 + (1 - a) * 16, w = 1620, h = 170;
  withAlpha(a, () => {
    card(x, y, w, h, { r:24, shadow:10, fill:P.card, shadowColor:s.dark ? P.accent : P.ink });
    ctx.fillStyle = P.accent; rr(x + 26, y + 30, 10, h - 60, 5); ctx.fill();
    text(b.text, x + 70, y + h / 2, { maxW:w - 120, maxLines:2, size:54, min:34, weight:750, vcenter:true, reveal:bt * 80 });
  });
}

/* =====================================================================
   3) VISUELS — un visuel = fonction(lt, plan, t). lt = temps local du plan
      (peut être < 0 ou > durée pendant les fondus : tout est « clampé »).
      Les éléments partagés (boîte-modèle, nuage de points, histogramme)
      sont des fonctions communes pour que les plans s'enchaînent.
   ===================================================================== */
const VISUALS = {};
const PL = id => SCRIPT.plans.find(p => p.id === id);

// ---------- ACTE 1 ----------
const HOOK_LAYOUT = { x:960, y:400, size:78, maxW:1560 };
function hookPhrase(reveal, color) { const L = HOOK_LAYOUT;
  return text(PL("P1").text, L.x, L.y, { size:L.size, weight:800, maxW:L.maxW, maxLines:2, align:"center", color, reveal, lh:1.25 }); }
VISUALS.typeLine = (lt) => {
  const n = PL("P1").text.length, k = seg(lt, .15, 2.35), r = hookPhrase(k * n, P.paper);
  const frozen = lt > 2.6, blink = Math.floor(lt * 2.6) % 2 === 0;
  if (!frozen && (blink || k < 1)) { ctx.fillStyle = P.accent; ctx.fillRect(r.caret.x + 6, r.caret.y + 6, 8, r.caret.h * 1.02); }
};
let PART = null;
function particles() {
  if (PART) return PART;
  const A = samplePixels(offscreen(() => hookPhrase(Infinity, "#000")), 5, 4200);
  const d = PL("P2").data;

let MIR = null;
function mirrorParticles() {
  if (MIR) return MIR;
  const src = [], r = rng(77);
  POINTS.forEach(p => { for (let k = 0; k < 4; k++) src.push([PX(p.x) + (r() - .5) * 20, PY(p.y) + (r() - .5) * 20, p.c ? P.orange : P.blue]); });
  NET.L.forEach((n, l) => { for (let i = 0; i < n; i++) for (let k = 0; k < 6; k++) src.push([150 + l * 95 + (r() - .5) * 20, 640 + (i - (n - 1) / 2) * 47 + (r() - .5) * 20, P.teal]); });
  for (let i = 0; i < 8; i++) for (let k = 0; k < 30; k++) src.push([432 + i * 168 + r() * 130, 735 + r() * 35, i === 4 ? P.accent : P.muted]);
  while (src.length < 760) src.push([r() * W, 150 + r() * 700, [P.sun, P.orange, P.blue, P.teal][Math.floor(r() * 4)]]);
  const tg = [], cx = 960, cy = 470, hw = 400, hh = 200;
  for (let i = 0; i < 300; i++) { const u = i / 300 * 2, up = u < 1, uu = up ? u : u - 1; tg.push([cx - hw + uu * 2 * hw, cy + (up ? -1 : 1) * hh * Math.sin(Math.PI * uu), 0]); }

}

/* =====================================================================
   4) RENDU + LECTURE
   ===================================================================== */
SCRIPT.plans.forEach((s, i) => s.index = i);
const planAt = t => SCRIPT.plans.find(s => t < s.end) || SCRIPT.plans[SCRIPT.plans.length - 1];
const XFADE = .35;
function drawPlan(s, t, a) { withAlpha(a, () => VISUALS[s.visual](t - s.start, s, t)); }
function render(t) {
  ctx = mainCtx; K = cv.width / W; ctx.setTransform(K, 0, 0, K, 0, 0);
  const s = planAt(t), prev = SCRIPT.plans[s.index - 1], k = prev ? seg(t, s.start, s.start + XFADE) : 1;
  background(s, t);
  if (prev && k < 1 && !(prev.visual === s.visual)) { if (prev.dark && !s.dark) { ctx.fillStyle = P.ink; ctx.fillRect(0, 0, W, H); } drawPlan(prev, t, 1 - k); drawPlan(s, t, k); }
  else drawPlan(s, t, 1);
  header(s);
  caption(s, t);
}

let T = 0, playing = false, last = 0, lastKey = "", soundOn = false, audio = null;
const $ = id => document.getElementById(id);
function beep(f = 660, d = .09, v = .05) {
  if (!soundOn) return; audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  const o = audio.createOscillator(), g = audio.createGain(); o.type = "sine"; o.frequency.value = f;
  g.gain.setValueAtTime(v, audio.currentTime); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + d);
  o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + d + .02);
}
function fmt(t) { t = Math.floor(t); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
function ui() {
  $("fill").style.width = (T / DUR * 100) + "%"; $("time").textContent = fmt(T) + " / " + fmt(DUR);
  $("play").textContent = playing ? "Pause" : (T >= DUR ? "Revoir" : "Lecture");
  const s = planAt(T), { b, i } = beatAt(s, T), key = s.index + ":" + i;
  if (key !== lastKey) { $("sub").textContent = fr(b.text); if (playing && lastKey) beep(s.index !== +lastKey.split(":")[0] ? 520 : 780); lastKey = key; }
}
function frame(now) {
  if (playing) { const dt = Math.min(.1, (now - last) / 1000); T = Math.min(DUR, T + dt);
    if (T >= DUR) { playing = false; $("overlayLabel").textContent = "Revoir le cours"; $("overlay").hidden = false; } }
  last = now; render(T); ui(); if (playing) requestAnimationFrame(frame);
}
function play() { if (T >= DUR) T = 0; playing = true; $("overlay").hidden = true; last = performance.now(); requestAnimationFrame(frame); }
function pause() { playing = false; ui(); }
function seek(t) { T = Math.max(0, Math.min(DUR, t)); if (!playing) { render(T); ui(); } }
$("overlay").onclick = () => { if (T > 0 && T < DUR && T !== POSTER) play(); else { T = 0; play(); } };
$("play").onclick = () => playing ? pause() : play();
$("sound").onclick = () => { soundOn = !soundOn; $("sound").textContent = "Son : " + (soundOn ? "on" : "off"); if (soundOn) beep(880, .08); };
const track = $("track");
SCRIPT.plans.slice(1).forEach(s => { const m = document.createElement("div"); m.className = "mark"; m.style.left = (s.start / DUR * 100) + "%"; track.appendChild(m); });
const seekFromEvent = e => { const r = track.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * DUR); };
track.addEventListener("pointerdown", e => { track.setPointerCapture(e.pointerId); seekFromEvent(e); $("overlay").hidden = true; });
track.addEventListener("pointermove", e => { if (e.buttons) seekFromEvent(e); });
document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); } });
function resize() { const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(960, Math.min(1920, Math.round(r.width * dpr))) || W; cv.height = Math.round(cv.width * 9 / 16); render(T); }
window.addEventListener("resize", resize);
// Vérification : window.__seek(t) fige l'image à t secondes ; ?t=12 dans l'URL fait pareil.
window.__seek = t => { playing = false; $("overlay").hidden = true; seek(t); };
const POSTER = 7.5;
const q = new URLSearchParams(location.search).get("t");
resize(); if (q != null) window.__seek(parseFloat(q)); else { T = POSTER; render(T); ui(); T = 0; $("fill").style.width = "0%"; $("time").textContent = "0:00 / 1:00"; }
