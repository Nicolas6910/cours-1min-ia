:root {
  --bg:#0B1020; --surface:#151D36; --line:#2A355A; --text:#EEF1F7; --muted:#98A2BD; --faint:#7682A3;
  --accent:#4C7DFF; --accent2:#FF4F79; --ease:cubic-bezier(.22,1,.36,1);
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; background:var(--bg); color:var(--text); -webkit-tap-highlight-color:transparent;
  font-family:"InterE",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
body { display:flex; align-items:center; justify-content:center; min-height:100%; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
.player { position:relative; width:min(100vw, calc(100vh * 16 / 9)); }
.stage { position:relative; width:100%; aspect-ratio:16/9; background:var(--bg); overflow:hidden; cursor:pointer; }
.stage.idle { cursor:none; }
canvas { display:block; width:100%; height:100%; }
.bigplay { position:absolute; left:50%; top:50%; width:88px; height:88px; margin:-44px 0 0 -44px; border-radius:50%;
  background:var(--accent); display:grid; place-items:center; transition:transform .3s var(--ease), opacity .3s var(--ease); }
.bigplay:hover { transform:scale(1.06); }
.bigplay svg { width:36px; height:36px; fill:var(--bg); }
.bigplay[hidden] { display:none; }
.hud { position:absolute; left:0; right:0; bottom:0; padding:22px 20px 8px;
  background:linear-gradient(to top, rgba(11,16,32,.72), rgba(11,16,32,0));
  transition:opacity .45s var(--ease), transform .45s var(--ease); }
.hud.hidden { opacity:0; transform:translateY(8px); pointer-events:none; }
.track { position:relative; height:18px; cursor:pointer; touch-action:none; }
.rail { position:absolute; left:0; right:0; top:7px; height:3px; border-radius:2px; background:rgba(238,241,247,.18);
  transition:height .25s var(--ease), top .25s var(--ease); overflow:hidden; }
.track:hover .rail { height:6px; top:6px; }
.fill { height:100%; width:0; background:var(--accent); }
.mark { position:absolute; top:4px; width:3px; height:10px; margin-left:-1px; background:var(--bg); pointer-events:none; }
.tip { position:absolute; bottom:22px; transform:translateX(-50%); padding:5px 9px; border-radius:6px; background:var(--surface);
  border:1px solid var(--line); font-size:12px; font-weight:600; letter-spacing:.04em; white-space:nowrap; opacity:0;
  transition:opacity .2s var(--ease); pointer-events:none; }
.track:hover .tip { opacity:1; }
.row { display:flex; align-items:center; gap:4px; margin-top:2px; }
.ic { width:38px; height:38px; border-radius:8px; display:grid; place-items:center; opacity:.85; transition:opacity .2s, background .2s; }
.ic:hover { opacity:1; background:rgba(238,241,247,.08); }
.ic svg { width:22px; height:22px; fill:none; stroke:var(--text); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.ic svg .f { fill:var(--text); stroke:none; }
.time { white-space:nowrap; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--muted); margin-left:6px; }
.chap { font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-left:14px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp { flex:1; }
.mpanel { display:none; }
@media (orientation:portrait) and (max-width:760px) {
  body { align-items:flex-start; }
  .player { width:100vw; padding-top:max(16px, env(safe-area-inset-top)); }
  .hud { position:static; background:none; padding:12px 16px 0; opacity:1 !important; transform:none !important; pointer-events:auto !important; }
  .mpanel { display:block; padding:20px 20px 32px; }
  .mchap { font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .mchap::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--accent); }
  .msub { margin-top:12px; font-size:22px; line-height:1.36; font-weight:600; letter-spacing:-.01em; min-height:6.2em;
    transition:opacity .35s var(--ease); }
  .chap { display:none; }
  .chapters { list-style:none; margin-top:20px; border-top:1px solid var(--line); }
  .chapters button { width:100%; display:flex; align-items:center; gap:14px; padding:14px 2px; border-bottom:1px solid var(--line);
    font-size:16px; font-weight:600; color:var(--muted); text-align:left; }
  .chapters .t { font-variant-numeric:tabular-nums; font-size:13px; color:var(--faint); width:34px; }
  .chapters .on button { color:var(--text); }
  .chapters .on .t { color:var(--accent); }
  .stage:fullscreen canvas { object-fit:contain; }
  .bigplay { width:64px; height:64px; margin:-32px 0 0 -32px; }
  .bigplay svg { width:26px; height:26px; }
}
</style>
</head>

  d.outputs.forEach((o, i) => { const y = 402 + i * 80, on = front > 1350 + i * 60; arrow(BOX4.x + BOX4.w + 12, 510, 1290, y + 29, 1, C.muted, 2);
    pill(1300, y, o, { size:TS.s, fill:on ? C.accent2 : null, stroke:on ? null : C.line, color:on ? C.bg : C.muted }); });
  counterPanel(enter(lt, .2), d.counter, d.share, C.accent2);
  const r = rng(Math.floor(t * 9)); if (lt > 1.2 && r() < .3) glitch(G.l, G.top, G.w, G.bot - G.top, 12, t);
};
VISUALS.flatGuess = (lt, s) => {
  const d = s.data;
  appear(enter(lt, .1), () => { const k = seg(lt, 1.7, 2.2), r = sentence(d.prefix, d.bars[d.pick][0], k);
    if (k <= 0 && Math.floor(lt * 3) % 2 === 0) { ctx.fillStyle = C.accent; ctx.fillRect(r.bx + 8, r.by - 38, 6, 76); }
    const prev = PL("P10").data.bars, n = d.bars.length, bw = 140, gap = 40, x0 = G.cx - (n * bw + (n - 1) * gap) / 2, f = EASE_IO(seg(lt, .1, .9));
    withAlpha(.6 * (1 - .45 * seg(lt, 1.2, 2.2)), () => { ctx.setLineDash([8, 8]); prev.forEach(([w, pct], i) => { const h = lerp(pct, 4, f) * HB.max / 41;
      ctx.lineWidth = 2; ctx.strokeStyle = C.faint; rr(x0 + i * (bw + gap), HB.base - h, bw, h, 8); ctx.stroke(); }); ctx.setLineDash([]); });
    histogram(d.bars, lt, { bw, gap, t0:.2, stagger:.06, pick:d.pick, pickAt:1.4 });
    text(d.note, G.cx, 580, { raw:true, size:TS.s, weight:400, align:"center", vcenter:true, color:C.muted });
    appear(enter(lt, 2.2, .4), () => { ctx.save(); ctx.translate(r.bx + r.bw + 36, G.top + 70); ctx.rotate(-.06);
      pill(0, -29, d.stamp, { size:TS.s, stroke:C.accent2, color:C.accent2, weight:700 }); ctx.restore(); }, 0); });
};

// ---------- ACTE 5 : tout reflue en un œil-miroir ----------
let MIR = null;
function mirrorParticles() {
  if (MIR) return MIR;
  const src = [], r = rng(77);
  POINTS.forEach(p => { for (let k = 0; k < 3; k++) src.push([PX(p.x) + (r() - .5) * 18, PY(p.y) + (r() - .5) * 18, CLS[p.c]]); });
  NET.L.forEach((n, l) => { for (let i = 0; i < n; i++) for (let k = 0; k < 5; k++) src.push([150 + l * 100 + (r() - .5) * 18, 610 + (i - (n - 1) / 2) * 50 + (r() - .5) * 18, C.accent]); });
  for (let i = 0; i < 8; i++) for (let k = 0; k < 28; k++) src.push([G.cx - 710 + i * 180 + r() * 140, HB.base - 14 + r() * 14, i === 4 ? C.accent : C.muted]);
  while (src.length < 760) src.push([G.l + r() * G.w, G.top + r() * 600, [C.accent, C.accent2, C.text][Math.floor(r() * 3)]]);
  const tg = [], cx = G.cx, cy = 490, hw = 380, hh = 190;
  for (let i = 0; i < 300; i++) { const u = i / 300 * 2, up = u < 1, uu = up ? u : u - 1; tg.push([cx - hw + uu * 2 * hw, cy + (up ? -1 : 1) * hh * Math.sin(Math.PI * uu), 0]); }
  for (let i = 0; i < 260; i++) { const a = r() * Math.PI * 2, rad = 90 + r() * 42; tg.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, 1]); }
  while (tg.length < src.length) { const a = r() * Math.PI * 2, rad = Math.sqrt(r()) * 54; tg.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad, 2]); }
  return MIR = src.map((s, i) => ({ sx:s[0], sy:s[1], c:s[2], tx:tg[i][0], ty:tg[i][1], part:tg[i][2], d:r() * .5, bend:(r() - .5) * 220 }));
}
VISUALS.mirror = (lt, s) => {
  const d = s.data, ps = mirrorParticles(), fin = EASE_IO(seg(lt, 4.0, 4.8));
  const blink = lt > 3.1 && lt < 3.5 ? Math.sin(Math.PI * seg(lt, 3.1, 3.5)) : 0, look = Math.sin(lt * 1.3) * 16 * seg(lt, 2.4, 3);
  const cx = G.cx, cy = 490, sc = lerp(1, .36, fin), ty = lerp(0, 290 - 490, fin);
  ctx.save(); ctx.translate(cx, cy + ty); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
  withAlpha(seg(lt, 2.2, 2.8), () => { ctx.beginPath(); for (let i = 0; i <= 80; i++) { const u = i / 40, up = u <= 1, uu = up ? u : u - 1, x = up ? cx - 380 + uu * 760 : cx + 380 - uu * 760;
    const y = cy + (up ? -1 : 1) * 190 * (1 - blink * .9) * Math.sin(Math.PI * uu); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.closePath(); ctx.fillStyle = C.surface2; ctx.fill(); });
  for (const p of ps) { const k = EASE_IO(seg(lt, p.d, p.d + 1.8));
    let x = lerp(p.sx, p.tx, k) + Math.sin(Math.PI * k) * p.bend, y = lerp(p.sy, p.ty, k) + Math.sin(Math.PI * k) * p.bend * .4;
    if (p.part > 0) x += look * k; y = cy + (y - cy) * (1 - blink * .9 * k);
    ctx.fillStyle = k < 1 ? p.c : p.part === 0 ? C.text : p.part === 1 ? (p.c === C.muted ? C.accent : p.c) : C.deep;
    const sz = p.part === 2 && k >= 1 ? 7 : 5; ctx.fillRect(x - sz / 2, y - sz / 2, sz, sz); }
  withAlpha(seg(lt, 2.3, 2.8) * (1 - blink), () => circle(cx + look - 20, cy - 22, 10, C.text));
  ctx.restore();
  appear(enter(lt, 4.3), () => text(d.kicker, G.cx, 400, { raw:true, size:TS.s, weight:400, align:"center", vcenter:true, color:C.muted }));
  appear(enter(lt, 4.5), () => text(d.line1, G.cx, 484, { raw:true, size:TS.xl, weight:800, align:"center", vcenter:true }));
  appear(enter(lt, 5.0), () => text(d.line2, G.cx, 578, { raw:true, size:TS.xl, weight:800, align:"center", vcenter:true, color:C.accent }));
  appear(enter(lt, 5.8), () => { ctx.fillStyle = C.accent; rr(G.cx - 24, 682, 48, 4, 2); ctx.fill(); label(SCRIPT.meta.footer, G.cx, 724, { align:"center", vcenter:true }); });
};

/* =====================================================================
   4) RENDU — une seule grammaire de transition entre plans :
      fondu enchaîné de 0,5 s + glissement vertical de 12 px, easing doux.
   ===================================================================== */
SCRIPT.plans.forEach((s, i) => s.index = i);
const planAt = t => SCRIPT.plans.find(s => t < s.end) || SCRIPT.plans[SCRIPT.plans.length - 1];
const XF = .5;
function drawPlan(s, t, a, dy) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.translate(0, dy); VISUALS[s.visual](t - s.start, s, t); ctx.restore(); }
function render(t) {
  ctx = mainCtx; K = cv.width / VIEW.w; ctx.setTransform(K, 0, 0, K, -VIEW.x * K, -VIEW.y * K);
  const s = planAt(t), prev = SCRIPT.plans[s.index - 1], k = prev ? EASE(seg(t, s.start, s.start + XF)) : 1;
  background();
  if (prev && k < 1 && prev.visual !== s.visual) { drawPlan(prev, t, 1 - k, -12 * k); drawPlan(s, t, k, 12 * (1 - k)); }
  else drawPlan(s, t, 1, 0);
  if (!PORTRAIT) { header(s); caption(s, t); }
}

/* =====================================================================
   5) LECTEUR — clic n'importe où = pause/reprise ; commandes qui
      s'effacent après 2 s d'inactivité ; chapitres sur la barre.
   ===================================================================== */
const $ = id => document.getElementById(id);
let T = 0, playing = false, last = 0, lastKey = "", soundOn = false, audio = null, started = false, idleTimer = 0;
const ACT_START = Object.keys(SCRIPT.acts).map(a => SCRIPT.plans.find(p => p.act === +a).start);
function beep(f = 660, d = .08, v = .04) {
  if (!soundOn) return; audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  const o = audio.createOscillator(), g = audio.createGain(); o.type = "sine"; o.frequency.value = f;
  g.gain.setValueAtTime(v, audio.currentTime); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + d);
  o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + d + .02);
}
const fmt = t => { t = Math.floor(t); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
function ui() {
  $("fill").style.width = (T / DUR * 100) + "%"; $("time").textContent = fmt(T) + " / " + fmt(DUR);
  $("playIcon").setAttribute("d", playing ? "M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" : "M8 5.5v13l10.5-6.5z");
  $("play").setAttribute("aria-label", playing ? "Pause" : "Lecture");
  const s = planAt(T), { b, i } = beatAt(s, T), key = s.index + ":" + i, chap = `Acte ${s.act} · ${SCRIPT.acts[s.act]}`;
  if ($("chap").textContent !== chap) { $("chap").textContent = chap; $("mchap").textContent = chap;
    [...$("chapters").children].forEach((li, i) => li.classList.toggle("on", i === s.act - 1)); }
  if (key !== lastKey) { $("msub").textContent = fr(b.text); if (playing && lastKey) beep(s.index !== +lastKey.split(":")[0] ? 520 : 780); lastKey = key; }
}
function frame(now) {
  if (playing) { T = Math.min(DUR, T + Math.min(.1, (now - last) / 1000));
    if (T >= DUR) { playing = false; $("bigplay").hidden = false; showHud(); } }
  last = now; render(T); ui(); if (playing) requestAnimationFrame(frame);
}
function play() { if (T >= DUR) T = 0; started = true; playing = true; $("bigplay").hidden = true; last = performance.now(); requestAnimationFrame(frame); poke(); }
function pause() { playing = false; ui(); showHud(); }
function toggle() { playing ? pause() : play(); }
function seek(t) { T = Math.max(0, Math.min(DUR, t)); if (!playing) { render(T); ui(); } }
function showHud() { $("hud").classList.remove("hidden"); $("stage").classList.remove("idle"); }
function poke() { showHud(); clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (playing && !PORTRAIT) { $("hud").classList.add("hidden"); $("stage").classList.add("idle"); } }, 2000); }
$("stage").addEventListener("click", () => { if (!started) { T = 0; play(); } else toggle(); });
$("bigplay").addEventListener("click", e => { e.stopPropagation(); if (!started || T >= DUR) T = 0; play(); });
$("play").onclick = toggle;
$("replay").onclick = () => { T = 0; play(); };
$("sound").onclick = () => { soundOn = !soundOn; $("soundWave").setAttribute("d", soundOn ? "M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10" : "M16 9l5 6M21 9l-5 6");
  $("sound").setAttribute("aria-label", soundOn ? "Couper le son" : "Activer le son"); if (soundOn) beep(880); };
$("fs").onclick = async () => { const el = $("stage");
  if (document.fullscreenElement) return document.exitFullscreen();
  try { await el.requestFullscreen(); if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape"); } catch (e) {} };
document.addEventListener("fullscreenchange", () => layout());
["pointermove", "pointerdown", "touchstart", "keydown"].forEach(ev => document.addEventListener(ev, poke, { passive:true }));
Object.keys(SCRIPT.acts).forEach((a, i) => { const li = document.createElement("li"), b = document.createElement("button");
  b.innerHTML = `<span class="t">${fmt(ACT_START[i])}</span><span>Acte ${a} · ${SCRIPT.acts[a]}</span>`;
  b.onclick = () => { started = true; $("bigplay").hidden = true; seek(ACT_START[i] + .01); if (!playing) play(); };
  li.appendChild(b); $("chapters").appendChild(li); });
const trackEl = $("track");
ACT_START.slice(1).forEach(s => { const m = document.createElement("div"); m.className = "mark"; m.style.left = (s / DUR * 100) + "%"; trackEl.appendChild(m); });
const tAt = e => { const r = trackEl.getBoundingClientRect(); return clamp01((e.clientX - r.left) / r.width) * DUR; };
trackEl.addEventListener("pointerdown", e => { trackEl.setPointerCapture(e.pointerId); started = true; $("bigplay").hidden = true; seek(tAt(e)); });
trackEl.addEventListener("pointermove", e => { const t = tAt(e), p = planAt(t); $("tip").textContent = `${fmt(t)} · ${SCRIPT.acts[p.act]}`; $("tip").style.left = (t / DUR * 100) + "%"; if (e.buttons) seek(t); });
document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.key === "k") { e.preventDefault(); if (!started) { T = 0; play(); } else toggle(); }
  else if (e.key === "ArrowRight") seek(T + 5); else if (e.key === "ArrowLeft") seek(T - 5); else if (e.key === "m") $("sound").click(); });
function layout() {
  PORTRAIT = matchMedia("(orientation: portrait) and (max-width: 760px)").matches && !document.fullscreenElement;
  VIEW = PORTRAIT ? { x:80, y:164, w:1760, h:692 } : { x:0, y:0, w:W, h:H };
  $("stage").style.aspectRatio = `${VIEW.w} / ${VIEW.h}`;
  const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.max(960, Math.min(1920, Math.round(r.width * dpr))); cv.height = Math.round(cv.width * VIEW.h / VIEW.w);
  render(T); ui();
}
window.addEventListener("resize", layout);
// Vérification : window.__seek(t) fige l'image à t secondes ; ?t=12 dans l'URL fait pareil.
window.__seek = t => { playing = false; started = true; $("bigplay").hidden = true; showHud(); seek(t); };
const POSTER = 7.5;
Promise.all([400, 600, 700, 800].map(w => document.fonts.load(`${w} 40px InterE`)).concat(document.fonts.load("400 40px MonoE"))).then(() => {
  layout(); const q = new URLSearchParams(location.search).get("t");
  if (q != null) window.__seek(parseFloat(q)); else { render(POSTER); T = 0; ui(); $("fill").style.width = "0%"; $("time").textContent = "0:00 / 1:00"; }
  window.__ready = true;
});
</script>
