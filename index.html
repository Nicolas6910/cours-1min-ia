<script>
/* =====================================================================
   1) SCRIPT — le seul bloc à réécrire pour un nouvel épisode.
      Chaque scène : fenêtre [start,end] en secondes, un visuel (clé de
      VISUALS plus bas), des « beats » = sous-titres horodatés, et les
      données propres au visuel (data).
   ===================================================================== */
const SCRIPT = {
  meta: {
    series: "Cours 1 minute",
    episode: 1,
    title: "C'est quoi l'IA ?",
    duration: 60,
    next: "Prochain épisode : la crypto",
    palette: { paper:"#F4ECDD", card:"#FFFBF3", ink:"#1F1B2D", accent:"#E4572E",
               teal:"#1F8A83", sun:"#F2B541", soft:"#E3D5BD", muted:"#6E6456" }
  },
  scenes: [
    { id:"hook", label:"L'accroche", start:0, end:7, visual:"phoneTyping",
      beats: [
        { at:0.0, text:"Ton téléphone devine le mot que tu vas taper." },
        { at:3.6, text:"Il ne lit pas dans tes pensées. Alors, comment ?" }
      ],
      data: { contact:"Léa", received:"Dispo cette semaine ?", typed:"On se voit",
              barsTitle:"Ce que calcule ton téléphone :", barsSub:"probabilité du mot suivant",
              suggestions:[["demain",46],["ce soir",31],["jeudi",12]] } },

    { id:"definition", label:"La définition", start:7, end:20, visual:"rulesVsExamples",
      beats: [
        { at:7.0,  text:"L'IA, c'est un programme qui apprend à partir d'exemples." },
        { at:12.0, text:"Avant, on écrivait toutes les règles à la main…" },
        { at:15.6, text:"Avec l'IA, on montre des millions d'exemples, et elle trouve les règles seule." }
      ],
      data: {
        stations:["Des exemples","Le programme apprend","Il en tire des règles"],
        rules:["trop de liens → spam","« URGENT » → spam","ami connu → pas spam"],
        oldTitle:"Avant : on écrit les règles", newTitle:"IA : on montre des exemples",
        code:["si le mail contient « gratuit »","→ alors spam","sinon si l'expéditeur est inconnu","→ alors… spam ?","sauf si c'est ta banque","sauf si… sauf si… sauf si…"],
        stamp:"Impossible de tout prévoir", counterTo:1000000, counterLabel:"exemples", found:"Elle en déduit les règles seule" } },

    { id:"mechanics", label:"La mécanique", start:20, end:40, visual:"training",
      beats: [
        { at:20.0, text:"1. Des données : des milliers de mails déjà étiquetés." },
        { at:25.0, text:"2. L'apprentissage : le réseau ajuste ses réglages pour faire moins d'erreurs." },
        { at:31.0, text:"À chaque passage, la frontière entre spam et pas spam se précise." },
        { at:35.5, text:"3. La prédiction : face à un mail inconnu, il parie sur le plus probable." }
      ],
      data: {
        classes:["spam","ok"], axisX:"nombre de liens →", axisY:"mots urgents →", netTitle:"Réseau de neurones",
        netSub:"des milliers de réglages", trainLabel:"Entraînement", newLabel:"Nouveau mail",
        newSubject:"Offre exclusive, cliquez vite !", verdict:"spam à 94 %",
        cards:[["Gagnez 1000 € !!!",1],["Réunion demain 10 h",0],["URGENT : votre colis",1],["Photos du week-end",0],
               ["Crédit gratuit, vite",1],["Facture de septembre",0],["Cliquez ici maintenant",1],["Anniversaire de Tom",0]] } },

    { id:"nuance", label:"La nuance", start:40, end:52, visual:"limits",
      beats: [
        { at:40.0, text:"Attention : l'IA ne comprend pas ce qu'elle dit." },
        { at:44.0, text:"Ni conscience, ni intention. Juste des probabilités." },
        { at:48.0, text:"Et si ses données sont biaisées, ses réponses le seront aussi." }
      ],
      data: {
        prompt:"Le chat dort sur le …", completions:[["canapé",38],["lit",27],["tapis",19]],
        aside:"Elle ne sait pas ce qu'est un chat.",
        checklist:[["Comprendre le sens",false,0.4],["Avoir une conscience",false,4.1],["Vouloir quelque chose",false,4.7],["Calculer des probabilités",true,5.6]],
        biasAt:8.1, dataTitle:"Données d'entraînement", dataNote:"90 % du même profil",
        outTitle:"Ses recommandations", outNote:"le même profil, encore et encore", stamp:"BIAIS" } },

    { id:"outro", label:"À retenir", start:52, end:60, visual:"outro", caption:false,
      beats: [
        { at:52.0, text:"L'IA ne pense pas. Elle prédit." },
        { at:55.5, text:"Et elle ne vaut que ce qu'on lui a appris." }
      ],
      data: { line1:"L'IA ne pense pas.", line2:"Elle prédit.", sub:"Et elle ne vaut que ce qu'on lui a appris.",
              recap:["Données","Motifs","Prédiction"] } }

/* =====================================================================
   2) MOTEUR — générique : horloge, fond, en-tête, sous-titres,
      transitions, primitives de dessin, son, contrôles.
   ===================================================================== */
const W = 1920, H = 1080;
const P = SCRIPT.meta.palette;
const DUR = SCRIPT.meta.duration;
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const MONO = 'ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace';
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let K = 1; // pixels réels par unité logique

// --- maths ---
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const seg = (v, a, b) => clamp01((v - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = k => 1 - Math.pow(1 - k, 3);
const eInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c = 1.70158; return k <= 0 ? 0 : 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// --- typographie (espaces insécables français avant : ; ? ! % et après «) ---
const fr = s => s.replace(/ ([:;?!»%€])/g, " $1").replace(/« /g, "« ");
function setFont(size, weight = 700, family = FONT) { ctx.font = `${weight} ${size}px ${family}`; }
function wrap(text, maxW) {
  const words = fr(text).split(" "), lines = []; let cur = "";
  for (const w of words) { const test = cur ? cur + " " + w : w;
    if (cur && ctx.measureText(test).width > maxW) { lines.push(cur); cur = w; } else cur = test; }
  if (cur) lines.push(cur); return lines;
}
function fit(text, maxW, maxLines, size, weight = 700, min = 18, family = FONT) {
  for (let s = size; s >= min; s -= 2) { setFont(s, weight, family); const l = wrap(text, maxW);
    if (l.length <= maxLines && l.every(x => ctx.measureText(x).width <= maxW)) return { lines:l, size:s }; }
  setFont(min, weight, family); return { lines:wrap(text, maxW), size:min };
}
// Dessine un bloc de texte ajusté ; align = left|center|right ; y = haut du bloc (ou centre si vcenter)
function text(str, x, y, o = {}) {
  const f = fit(str, o.maxW || 1600, o.maxLines || 1, o.size || 40, o.weight || 700, o.min || 18, o.family || FONT);
  const lh = f.size * (o.lh || 1.2), total = f.lines.length * lh;
  let yy = o.vcenter ? y - total / 2 : y;
  ctx.fillStyle = o.color || P.ink; ctx.textAlign = o.align || "left"; ctx.textBaseline = "top";
  const chars = o.reveal == null ? Infinity : o.reveal;
  let used = 0;
  for (const l of f.lines) { const n = Math.max(0, Math.min(l.length, chars - used)); used += l.length + 1;
    if (n > 0) ctx.fillText(l.slice(0, n), x, yy + f.size * 0.08); yy += lh; }
  return { h:total, size:f.size, lines:f.lines };
}

// --- primitives ---
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function card(x, y, w, h, o = {}) {
  const r = o.r == null ? 18 : o.r, sh = o.shadow == null ? 8 : o.shadow;
  if (sh) { ctx.fillStyle = o.shadowColor || P.ink; rr(x + sh, y + sh, w, h, r); ctx.fill(); }
  ctx.fillStyle = o.fill || P.card; rr(x, y, w, h, r); ctx.fill();
  if (o.stroke !== false) { ctx.lineWidth = o.lw || 4; ctx.strokeStyle = o.stroke || P.ink; ctx.stroke(); }
}
function circle(x, y, r, fill, stroke, lw = 3) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } }
function line(x1, y1, x2, y2, color = P.ink, lw = 4) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.stroke(); }
function arrow(x1, y1, x2, y2, k = 1, color = P.ink, lw = 6) {
  if (k <= 0) return; const x = lerp(x1, x2, k), y = lerp(y1, y2, k); line(x1, y1, x, y, color, lw);
  const a = Math.atan2(y2 - y1, x2 - x1), s = 18; ctx.beginPath(); ctx.moveTo(x, y);
  ctx.lineTo(x - s * Math.cos(a - .5), y - s * Math.sin(a - .5)); ctx.moveTo(x, y);
  ctx.lineTo(x - s * Math.cos(a + .5), y - s * Math.sin(a + .5)); ctx.stroke(); }
function check(x, y, s, k, color = P.teal, lw = 9) { if (k <= 0) return; ctx.beginPath();
  const p = [[x - s * .5, y], [x - s * .12, y + s * .38], [x + s * .55, y - s * .42]];
  ctx.moveTo(p[0][0], p[0][1]); const k1 = clamp01(k * 2), k2 = clamp01(k * 2 - 1);
  ctx.lineTo(lerp(p[0][0], p[1][0], k1), lerp(p[0][1], p[1][1], k1));
  if (k2 > 0) ctx.lineTo(lerp(p[1][0], p[2][0], k2), lerp(p[1][1], p[2][1], k2));
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke(); }
function cross(x, y, s, k, color = P.accent, lw = 9) { const k1 = clamp01(k * 2), k2 = clamp01(k * 2 - 1);
  if (k1 > 0) line(x - s / 2, y - s / 2, lerp(x - s / 2, x + s / 2, k1), lerp(y - s / 2, y + s / 2, k1), color, lw);
  if (k2 > 0) line(x + s / 2, y - s / 2, lerp(x + s / 2, x - s / 2, k2), lerp(y - s / 2, y + s / 2, k2), color, lw); }
function envelope(x, y, w, h, color) { ctx.fillStyle = color; rr(x, y, w, h, 5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 4, y + 5); ctx.lineTo(x + w / 2, y + h * .58); ctx.lineTo(x + w - 4, y + 5);
  ctx.strokeStyle = P.card; ctx.lineWidth = 3; ctx.lineJoin = "round"; ctx.stroke(); }
function person(cx, cy, s, color) { circle(cx, cy - s * .42, s * .26, color);
  ctx.fillStyle = color; rr(cx - s * .42, cy - s * .08, s * .84, s * .6, s * .28); ctx.fill(); }
function chip(x, y, label, color, size = 22, fg = P.card) { setFont(size, 800); const w = ctx.measureText(label).width + size * 1.1;
  ctx.fillStyle = color; rr(x, y, w, size * 1.55, size * .78); ctx.fill(); ctx.fillStyle = fg; ctx.textAlign = "left";
  ctx.textBaseline = "middle"; ctx.fillText(label, x + size * .55, y + size * .8); return w; }
function withAlpha(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; fn(); ctx.restore(); }
function popAt(lt, t0, d = .45) { return eBack(seg(lt, t0, t0 + d)); }
function scaled(cx, cy, s, fn) { if (s <= 0) return; ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); fn(); ctx.restore(); }

// --- glitch : recopie de bandes décalées + franges colorées (déterministe par temps) ---
function glitch(x, y, w, h, amp, t) {
  const r = rng(Math.floor(t * 18) * 7919 + 13);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (let i = 0; i < 9; i++) { const sy = y + r() * h, sh = 6 + r() * 34, off = (r() - .5) * 2 * amp;
    const hh = Math.min(sh, y + h - sy); if (hh <= 1) continue;
    ctx.drawImage(cv, x * K, sy * K, w * K, hh * K, (x + off) * K, sy * K, w * K, hh * K); }
  ctx.restore();
  for (let i = 0; i < 5; i++) { const sy = y + r() * h; ctx.fillStyle = r() < .5 ? "rgba(228,87,46,.35)" : "rgba(31,138,131,.35)";
    ctx.fillRect(x + r() * w * .6, sy, w * (.15 + r() * .4), 3 + r() * 10); }
  ctx.fillStyle = "rgba(31,27,45,.06)"; for (let yy = y; yy < y + h; yy += 6) ctx.fillRect(x, yy, w, 2);
}

// --- fond papier ---
const grain = (() => { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"); const r = rng(42);
  for (let i = 0; i < 2600; i++) { g.fillStyle = r() < .5 ? "rgba(31,27,45,.05)" : "rgba(255,255,255,.35)"; g.fillRect(r() * 256, r() * 256, 1 + r() * 2, 1 + r() * 2); }
  return c; })();
const DECO = [[1700, 180, 260, "sun"], [200, 900, 300, "soft"], [1750, 950, 280, "sun"], [150, 180, 240, "soft"], [960, 540, 560, "soft"]];
function background(si, t) {
  ctx.fillStyle = P.paper; ctx.fillRect(0, 0, W, H);
  const d = DECO[si % DECO.length]; ctx.globalAlpha = .45;
  circle(d[0] + Math.sin(t * .4) * 12, d[1] + Math.cos(t * .3) * 12, d[2], P[d[3]]); ctx.globalAlpha = 1;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = ctx.createPattern(grain, "repeat"); ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore();
}

// --- en-tête, sous-titres, transitions ---
const num = i => String(i + 1).padStart(2, "0");
function header(s) {
  setFont(26, 800); const label = `${num(s.index)} · ${s.label.toUpperCase()}`; const w = ctx.measureText(label).width + 44;
  ctx.fillStyle = P.ink; rr(56, 40, w, 54, 27); ctx.fill(); ctx.fillStyle = P.paper; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText(label, 78, 68);
  setFont(26, 650); ctx.fillStyle = P.muted; ctx.textAlign = "right"; ctx.fillText(`${SCRIPT.meta.series} · ${SCRIPT.meta.title}`, 1864, 68);
}
function beatAt(s, t) { let b = s.beats[0], i = 0; s.beats.forEach((x, j) => { if (t >= x.at) { b = x; i = j; } }); return { b, i }; }
function caption(s, t) {
  if (s.caption === false) return;
  const { b } = beatAt(s, t), bt = t - b.at, a = eOut(seg(bt, 0, .3));
  const x = 150, y = 868 + (1 - a) * 20, w = 1620, h = 170;
  withAlpha(a, () => {
    card(x, y, w, h, { r:24, shadow:10, fill:P.card });
    ctx.fillStyle = P.accent; rr(x + 26, y + 30, 10, h - 60, 5); ctx.fill();
    text(b.text, x + 70, y + h / 2, { maxW:w - 120, maxLines:2, size:56, min:34, weight:750, vcenter:true, reveal:bt * 75 });
  });
}
function transition(t) {
  SCRIPT.scenes.forEach((s, i) => { if (!i) return; const u = seg(t, s.start - .38, s.start + .38); if (u <= 0 || u >= 1) return;
    const l = u < .5 ? -W + W * eInOut(u * 2) : W * eInOut((u - .5) * 2), r = l + W;
    ctx.save(); ctx.beginPath(); ctx.rect(l, 0, W, H); ctx.clip();
    ctx.fillStyle = P.ink; ctx.fillRect(0, 0, W, H); ctx.fillStyle = P.accent; ctx.fillRect(0, H - 26, W, 26);
    setFont(260, 900); ctx.fillStyle = P.accent; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(num(i), W / 2, H / 2 - 70);
    setFont(72, 800); ctx.fillStyle = P.paper; ctx.fillText(s.label, W / 2, H / 2 + 110);
    ctx.restore(); });
}

/* =====================================================================
   3) VISUELS — un visuel = fonction (lt = temps local de scène, s = scène).
      Réutilisables d'un épisode à l'autre en changeant s.data.
   ===================================================================== */
const VISUALS = {};

VISUALS.phoneTyping = (lt, s) => {
  const d = s.data, enter = eOut(seg(lt, 0, .6));
  const px = 430, py = 140 + (1 - enter) * 80, pw = 380, ph = 690;
  withAlpha(enter, () => {
    card(px, py, pw, ph, { r:52, fill:P.ink, shadow:12, shadowColor:P.accent });
    const sx = px + 16, sy = py + 16, sw = pw - 32, sh = ph - 32;
    ctx.fillStyle = P.card; rr(sx, sy, sw, sh, 38); ctx.fill();
    ctx.fillStyle = P.ink; rr(px + pw / 2 - 50, sy + 10, 100, 20, 10); ctx.fill();
    circle(sx + 44, sy + 72, 22, P.sun); text(d.contact, sx + 78, sy + 56, { size:28, weight:800 });
    line(sx + 16, sy + 110, sx + sw - 16, sy + 110, P.soft, 3);
    // bulle reçue
    setFont(24, 600); const bw = Math.min(sw - 60, ctx.measureText(d.received).width + 40);
    ctx.fillStyle = P.soft; rr(sx + 18, sy + 136, bw, 58, 22); ctx.fill();
    text(d.received, sx + 38, sy + 150, { size:24, weight:600, maxW:bw - 40 });
    // clavier AZERTY
    const kh = 236, ky = sy + sh - kh - 16, rows = ["azertyuiop", "qsdfghjklm", "wxcvbn"];
    const kw = (sw - 20 - 9 * 5) / 10, n = Math.floor(seg(lt, .4, 1.9) * d.typed.length);
    const lastCh = n > 0 ? d.typed[n - 1].toLowerCase() : null, pressed = lt < 2.05 && lt > .4 && ((lt - .4) / (1.5 / d.typed.length)) % 1 < .55;
    rows.forEach((row, ri) => { const rw = row.length * kw + (row.length - 1) * 5, rx = sx + (sw - rw) / 2;
      [...row].forEach((c, ci) => { const x = rx + ci * (kw + 5), y = ky + ri * 56, on = pressed && c === lastCh;
        ctx.fillStyle = on ? P.accent : "#EDE3D2"; rr(x, y, kw, 48, 8); ctx.fill();
        setFont(22, 700); ctx.fillStyle = on ? P.card : P.ink; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(c, x + kw / 2, y + 25); }); });

function render(t) {
  K = cv.width / W; ctx.setTransform(K, 0, 0, K, 0, 0);
  const s = sceneAt(t), lt = t - s.start;
  background(s.index, t);
  VISUALS[s.visual](lt, s, t);
  header(s);
  caption(s, t);
  transition(t);
}

let T = 0, playing = false, last = 0, lastKey = "", soundOn = false, audio = null;
const $ = id => document.getElementById(id);
function beep(f = 660, d = .09, v = .05, type = "sine") {
  if (!soundOn) return; audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  const o = audio.createOscillator(), g = audio.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, audio.currentTime); g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime + d);
  o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + d + .02);
}
function fmt(t) { t = Math.floor(t); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
function ui() {
  $("fill").style.width = (T / DUR * 100) + "%"; $("time").textContent = fmt(T) + " / " + fmt(DUR);
  $("play").textContent = playing ? "Pause" : (T >= DUR ? "Revoir" : "Lecture");
  const s = sceneAt(T), { b, i } = beatAt(s, T), key = s.index + ":" + i;
  if (key !== lastKey) { $("sub").textContent = fr(b.text); if (playing && lastKey) beep(s.index !== +lastKey.split(":")[0] ? 520 : 780); lastKey = key; }
}
function frame(now) {
  if (playing) { const dt = Math.min(.1, (now - last) / 1000); T = Math.min(DUR, T + dt);
    if (T >= DUR) { playing = false; $("overlayLabel").textContent = "Revoir le cours"; $("overlay").hidden = false; } }
  last = now; render(T); ui(); if (playing) requestAnimationFrame(frame);
}
function play() { if (T >= DUR) T = 0; playing = true; $("overlay").hidden = true; last = performance.now(); requestAnimationFrame(frame); }
function pause() { playing = false; ui(); }
function seek(t) { T = Math.max(0, Math.min(DUR, t)); if (!playing) { render(T); ui(); } }
$("overlay").onclick = play;
$("play").onclick = () => playing ? pause() : play();
$("sound").onclick = () => { soundOn = !soundOn; $("sound").textContent = "Son : " + (soundOn ? "on" : "off"); if (soundOn) beep(880, .08); };
const track = $("track");
SCRIPT.scenes.slice(1).forEach(s => { const m = document.createElement("div"); m.className = "mark"; m.style.left = (s.start / DUR * 100) + "%"; track.appendChild(m); });
const seekFromEvent = e => { const r = track.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * DUR); };
track.addEventListener("pointerdown", e => { track.setPointerCapture(e.pointerId); seekFromEvent(e); $("overlay").hidden = true; });
track.addEventListener("pointermove", e => { if (e.buttons) seekFromEvent(e); });
document.addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); } });
function resize() { const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  const pw = Math.max(960, Math.min(1920, Math.round(r.width * dpr))) || W; cv.width = pw; cv.height = Math.round(pw * 9 / 16); render(T); }
window.addEventListener("resize", resize);
// Hook de vérification : window.__seek(t) fige l'image à t secondes ; ?t=12 dans l'URL fait pareil.
window.__seek = t => { playing = false; $("overlay").hidden = true; seek(t); };
const q = new URLSearchParams(location.search).get("t");
resize(); if (q != null) window.__seek(parseFloat(q)); else { render(0.6); ui(); }
</script>
