<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<title>C'est quoi l'IA ? · Cours 1 minute</title>
<link rel="icon" href="data:,">
<meta name="description" content="Cours vidéo d'une minute, animé en JavaScript : c'est quoi l'intelligence artificielle ?">
<style>
/*@FONTFACE@*/
:root {
  --bg:#0B1020; --surface:#151D36; --line:#2A355A; --text:#EEF1F7; --muted:#98A2BD; --faint:#5D688A;
  --accent:#4C7DFF; --accent2:#FF4F79; --ease:cubic-bezier(.22,1,.36,1);
}
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; background:var(--bg); color:var(--text); -webkit-tap-highlight-color:transparent;
  font-family:"InterE",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
body { display:flex; align-items:center; justify-content:center; min-height:100%; }
button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
.player { position:relative; width:min(100vw, calc(100vh * 16 / 9)); }
.stage { position:relative; width:100%; aspect-ratio:16/9; background:var(--bg); overflow:hidden; cursor:pointer; }
.stage.idle { cursor:none; }
canvas { display:block; width:100%; height:100%; }
.bigplay { position:absolute; left:50%; top:50%; width:88px; height:88px; margin:-44px 0 0 -44px; border-radius:50%;
  background:var(--accent); display:grid; place-items:center; transition:transform .3s var(--ease), opacity .3s var(--ease); }
.bigplay:hover { transform:scale(1.06); }
.bigplay svg { width:36px; height:36px; fill:var(--bg); }
.bigplay[hidden] { display:none; }
.hud { position:absolute; left:0; right:0; bottom:0; padding:22px 20px 8px;
  background:linear-gradient(to top, rgba(11,16,32,.72), rgba(11,16,32,0));
  transition:opacity .45s var(--ease), transform .45s var(--ease); }
.hud.hidden { opacity:0; transform:translateY(8px); pointer-events:none; }
.track { position:relative; height:18px; cursor:pointer; touch-action:none; }
.rail { position:absolute; left:0; right:0; top:7px; height:3px; border-radius:2px; background:rgba(238,241,247,.18);
  transition:height .25s var(--ease), top .25s var(--ease); overflow:hidden; }
.track:hover .rail { height:6px; top:6px; }
.fill { height:100%; width:0; background:var(--accent); }
.mark { position:absolute; top:4px; width:3px; height:10px; margin-left:-1px; background:var(--bg); pointer-events:none; }
.tip { position:absolute; bottom:22px; transform:translateX(-50%); padding:5px 9px; border-radius:6px; background:var(--surface);
  border:1px solid var(--line); font-size:12px; font-weight:600; letter-spacing:.04em; white-space:nowrap; opacity:0;
  transition:opacity .2s var(--ease); pointer-events:none; }
.track:hover .tip { opacity:1; }
.row { display:flex; align-items:center; gap:4px; margin-top:2px; }
.ic { width:38px; height:38px; border-radius:8px; display:grid; place-items:center; opacity:.85; transition:opacity .2s, background .2s; }
.ic:hover { opacity:1; background:rgba(238,241,247,.08); }
.ic svg { width:22px; height:22px; fill:none; stroke:var(--text); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.ic svg .f { fill:var(--text); stroke:none; }
.time { white-space:nowrap; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; color:var(--muted); margin-left:6px; }
.chap { font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-left:14px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sp { flex:1; }
.mpanel { display:none; }
@media (orientation:portrait) and (max-width:760px) {
  body { align-items:flex-start; }
  .player { width:100vw; padding-top:max(16px, env(safe-area-inset-top)); }
  .hud { position:static; background:none; padding:12px 16px 0; opacity:1 !important; transform:none !important; pointer-events:auto !important; }
  .mpanel { display:block; padding:20px 20px 32px; }
  .mchap { font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .mchap::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--accent); }
  .msub { margin-top:12px; font-size:22px; line-height:1.36; font-weight:600; letter-spacing:-.01em; min-height:6.2em;
    transition:opacity .35s var(--ease); }
  .chap { display:none; }
  .chapters { list-style:none; margin-top:20px; border-top:1px solid var(--line); }
  .chapters button { width:100%; display:flex; align-items:center; gap:14px; padding:14px 2px; border-bottom:1px solid var(--line);
    font-size:16px; font-weight:600; color:var(--muted); text-align:left; }
  .chapters .t { font-variant-numeric:tabular-nums; font-size:13px; color:var(--faint); width:34px; }
  .chapters .on button { color:var(--text); }
  .chapters .on .t { color:var(--accent); }
  .stage:fullscreen canvas { object-fit:contain; }
  .bigplay { width:64px; height:64px; margin:-32px 0 0 -32px; }
  .bigplay svg { width:26px; height:26px; }
}
</style>
</head>
<body>
<div class="player" id="player">
  <div class="stage" id="stage">
    <canvas id="cv" width="1920" height="1080" aria-label="Animation : c'est quoi l'IA ?"></canvas>
    <button class="bigplay" id="bigplay" aria-label="Lancer le cours"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg></button>
  </div>
  <div class="hud" id="hud">
    <div class="track" id="track"><div class="rail"><div class="fill" id="fill"></div></div><div class="tip" id="tip"></div></div>
    <div class="row">
      <button class="ic" id="play" aria-label="Lecture"><svg viewBox="0 0 24 24"><path class="f" id="playIcon" d="M8 5.5v13l10.5-6.5z"/></svg></button>
      <button class="ic" id="replay" aria-label="Revoir depuis le début"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
      <span class="time" id="time">0:00 / 1:00</span>
      <span class="chap" id="chap"></span>
      <span class="sp"></span>
      <button class="ic" id="sound" aria-label="Activer le son"><svg viewBox="0 0 24 24"><path class="f" d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path id="soundWave" d="M16 9l5 6M21 9l-5 6"/></svg></button>
      <button class="ic" id="fs" aria-label="Plein écran"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
  <div class="mpanel"><div class="mchap" id="mchap"></div><div class="msub" id="msub" aria-live="polite"></div><ol class="chapters" id="chapters"></ol></div>
</div>

<script>
/* =====================================================================
   1) SCRIPT — le seul bloc à réécrire pour un nouvel épisode.
      acts : chapitres ; plans : fenêtre [start,end] en secondes, texte,
      visuel (clé de VISUALS), données (data). caption:false = le texte
      est déjà l'image ; beats = découpe d'un plan long en sous-titres.
   ===================================================================== */
const SCRIPT = {
  meta: { series:"Cours 1 minute", episode:1, title:"C'est quoi l'IA ?", duration:60, footer:"Épisode 1 · la série continue" },
  acts: { 1:"Hook", 2:"Définition", 3:"Mécanique", 4:"Nuance", 5:"Conclusion" },
  plans: [
    { id:"P1", act:1, start:0.0, end:3.0, visual:"typeLine", caption:false,
      text:"Ce texte a été écrit par une machine qui ne sait pas ce qu'elle dit." },
    { id:"P2", act:1, start:3.0, end:8.0, visual:"particlesTitle",
      text:"Et pourtant, elle a raison. Voilà comment c'est possible.", data:{ title:"C'EST QUOI L'IA ?" } },
    { id:"P3", act:2, start:8.0, end:12.0, visual:"brainVsBox",
      text:"L'IA, ce n'est pas un cerveau. C'est une machine à deviner.",
      data:{ left:"un cerveau", right:"une machine à deviner", input:"entrée", output:"sortie", guess:"chat · 92 %" } },
    { id:"P4", act:2, start:12.0, end:16.0, visual:"dataStream",
      text:"On lui montre des millions d'exemples. Elle en extrait des règles que personne ne lui a écrites.",
      data:{ counter:"exemples vus", rules:["moustaches → chat","boucle + barre → 9","« dort sur le » → un lieu"] } },
    { id:"P5", act:2, start:16.0, end:20.0, visual:"codeVsWeights",
      text:"Programmer, c'est dicter les règles. Entraîner, c'est les laisser émerger.",
      data:{ leftTitle:"Programmer", leftSub:"On dicte les règles.", rightTitle:"Entraîner", rightSub:"Les règles émergent.",
             leftNote:"à la main, ligne par ligne", rightNote:"ajustements automatiques",
             code:["si oreilles_pointues(img)","  et moustaches(img) :","    réponse = « chat »","sinon si …","# et un chat de dos ?","# et un chat flou ?"] } },
    { id:"P6", act:3, start:20.0, end:24.0, visual:"plot", step:0, text:"Étape 1 : les données. Des exemples, avec la bonne réponse." },
    { id:"P7", act:3, start:24.0, end:29.0, visual:"plot", step:1, text:"Étape 2 : le modèle devine. Au début, n'importe quoi." },
    { id:"P8", act:3, start:29.0, end:34.0, visual:"plot", step:2, text:"Étape 3 : il mesure son erreur, et corrige. Des milliards de fois." },
    { id:"P9", act:3, start:34.0, end:38.0, visual:"valley", text:"C'est tout. Pas de magie : une descente, pas à pas, vers moins d'erreur." },
    { id:"P10", act:3, start:38.0, end:42.0, visual:"nextWord",
      text:"Un modèle de langage fait pareil, sur un seul jeu : deviner le mot suivant.",
      data:{ prefix:"Le chat dort sur le", bars:[["canapé",41],["lit",27],["toit",9]], pick:0, note:"Le plus probable l'emporte." } },
    { id:"P11", act:4, start:42.0, end:46.0, visual:"hollowWord",
      text:"Elle prédit, elle ne comprend pas. Aucune intention derrière le mot.", data:{ word:"comprendre", keep:"prédire", note:"Il ne reste que le contour." } },
    { id:"P12", act:4, start:46.0, end:50.0, visual:"biasStream", text:"Ce qu'elle a lu, elle le reproduit. Biais compris.",
      data:{ outputs:["mêmes clichés","mêmes oublis","même point de vue"], counter:"part teintée", share:"75 %" } },
    { id:"P13", act:4, start:50.0, end:53.0, visual:"flatGuess", text:"Et quand elle ne sait pas, elle devine quand même. Avec aplomb.",
      data:{ prefix:"Le zorglub dort sur le", bars:[["canapé",4],["lit",4],["toit",4],["sol",4],["piano",4],["frigo",4],["nuage",4],["bus",4]],
             pick:4, note:"… et 17 autres mots, tous à 4 %", stamp:"sans hésiter" } },
    { id:"P14", act:5, start:53.0, end:60.0, visual:"mirror",
      text:"L'IA n'est pas une intelligence. C'est un miroir statistique de ce qu'on lui a donné. La question n'est plus ce qu'elle sait, mais ce qu'on lui a montré.",
      beats:[ { at:53.0, text:"L'IA n'est pas une intelligence." },
              { at:55.0, text:"C'est un miroir statistique de ce qu'on lui a donné." },
              { at:57.0, text:"La question n'est plus ce qu'elle sait, mais ce qu'on lui a montré.", caption:false } ],
      data:{ kicker:"L'IA n'est pas une intelligence : c'est un miroir statistique.",
             line1:"La question n'est plus ce qu'elle sait,", line2:"mais ce qu'on lui a montré." } }
  ]
};

/* =====================================================================
   2) SYSTÈME DE DESIGN — palette, échelle typographique, grille.
   ===================================================================== */
const C = { bg:"#0B1020", surface:"#151D36", surface2:"#1C2645", line:"#2A355A", text:"#EEF1F7", muted:"#98A2BD",
            faint:"#5D688A", accent:"#4C7DFF", accent2:"#FF4F79", deep:"#060913" };
// Échelle modulaire 4:3 (px pour une image 1920×1080)
const TS = { xs:24, s:32, m:42, l:56, xl:76, xxl:100, d:136, dd:180 };
// Grille : marges 120 px, en-tête centré à y=96, zone de contenu 200→820, sous-titre 872→1008
const G = { l:120, r:1800, w:1680, cx:960, top:200, bot:820, head:96, cap:872 };
const RADIUS = 16;
const W = 1920, H = 1080, DUR = SCRIPT.meta.duration;
const FONT = '"InterE",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
const MONO = '"MonoE",ui-monospace,Menlo,Consolas,monospace';
const cv = document.getElementById("cv"), mainCtx = cv.getContext("2d");
let ctx = mainCtx, K = 1, VIEW = { x:0, y:0, w:W, h:H }, PORTRAIT = false;

/* ---------- maths & easing (jamais de linéaire pour le mouvement) ---------- */
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const seg = (v, a, b) => clamp01((v - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t, dx = t => (3 * ax * t + 2 * bx) * t + cx;
  return k => { if (k <= 0) return 0; if (k >= 1) return 1; let t = k; for (let i = 0; i < 6; i++) { const d = dx(t); if (Math.abs(d) < 1e-6) break; t -= (sx(t) - k) / d; } return sy(clamp01(t)); };
}
const EASE = bezier(.22, 1, .36, 1);      // entrées
const EASE_IO = bezier(.65, 0, .35, 1);   // déplacements
const EASE_IN = bezier(.55, 0, 1, .45);   // aspiration
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function mix(c1, c2, k) { const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const r = Math.round(lerp(a >> 16, b >> 16, k)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, k)), bl = Math.round(lerp(a & 255, b & 255, k));
  return "#" + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1); }
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

/* ---------- typographie ---------- */
const fr = s => s.replace(/ ([:;?!»%€])/g, " $1").replace(/« /g, "« ");
function track(size, t) { return t != null ? t : size >= 76 ? -.025 : size >= 42 ? -.012 : 0; }
function setFont(size, weight = 600, family = FONT, tr) {
  ctx.font = `${weight} ${size}px ${family}`;
  if ("letterSpacing" in ctx) ctx.letterSpacing = (track(size, tr) * size).toFixed(2) + "px";
}
function wrap(text, maxW) { const words = fr(text).split(" "), lines = []; let cur = "";
  for (const w of words) { const t = cur ? cur + " " + w : w; if (cur && ctx.measureText(t).width > maxW) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines; }
// Pas de rétrécissement automatique : la taille reste sur l'échelle, le texte passe à la ligne.
function text(str, x, y, o = {}) {
  const size = o.size || TS.s, wt = o.weight || 600, fam = o.family || FONT;
  setFont(size, wt, fam, o.tracking);
  const s = o.upper ? str.toUpperCase() : str;
  const lines = o.raw ? [s] : wrap(s, o.maxW || G.w);
  const lh = size * (o.lh || 1.2), total = lines.length * lh; let yy = o.vcenter ? y - total / 2 : y;
  ctx.fillStyle = o.color || C.text; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  const chars = o.reveal == null ? Infinity : o.reveal; let used = 0, caret = null, maxw = 0;
  for (const l of lines) { const lw = ctx.measureText(l).width, lx = o.align === "center" ? x - lw / 2 : o.align === "right" ? x - lw : x; maxw = Math.max(maxw, lw);
    const base = yy + lh / 2 + size * .36;
    if (!caret) caret = { x:lx, y:base - size * .8, h:size };
    const n = Math.max(0, Math.min(l.length, chars - used)); used += l.length + 1;
    if (n > 0) { const part = l.slice(0, n); ctx.fillText(part, lx, base); caret = { x:lx + ctx.measureText(part).width, y:base - size * .8, h:size }; }
    yy += lh; }
  return { h:total, lines, caret, w:maxw };
}
const label = (str, x, y, o = {}) => text(str, x, y, Object.assign({ size:TS.xs, weight:600, upper:true, tracking:.12, color:C.muted, raw:true }, o));

/* ---------- primitives ---------- */
function rr(x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function panel(x, y, w, h, o = {}) { ctx.fillStyle = o.fill || C.surface; rr(x, y, w, h, o.r == null ? RADIUS : o.r); ctx.fill();
  if (o.stroke !== false) { ctx.lineWidth = o.lw || 2; ctx.strokeStyle = o.stroke || C.line; ctx.stroke(); } }
function pill(x, y, str, o = {}) { const size = o.size || TS.s; setFont(size, o.weight || 600); const s = fr(str), pad = size * .8, h = size * 1.8;
  const w = ctx.measureText(s).width + pad * 2 + (o.icon ? size * .9 : 0), px = o.align === "center" ? x - w / 2 : x;
  rr(px, y, w, h, h / 2); if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); } if (o.stroke) { ctx.lineWidth = 2; ctx.strokeStyle = o.stroke; ctx.stroke(); }
  if (o.icon) check(px + pad + size * .3, y + h / 2, size * .55, 1, o.color || C.bg, 4);
  text(s, px + pad + (o.icon ? size * .9 : 0), y + h / 2, { raw:true, size, weight:o.weight || 600, vcenter:true, color:o.color || C.text });
  return { x:px, w, h }; }
function circle(x, y, r, fill, stroke, lw = 2) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } }
function line(x1, y1, x2, y2, color = C.line, lw = 2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.stroke(); }
function arrow(x1, y1, x2, y2, k = 1, color = C.muted, lw = 3) { if (k <= 0) return; const x = lerp(x1, x2, k), y = lerp(y1, y2, k); line(x1, y1, x, y, color, lw);
  const a = Math.atan2(y2 - y1, x2 - x1), s = 13; ctx.beginPath(); ctx.moveTo(x - s * Math.cos(a - .55), y - s * Math.sin(a - .55)); ctx.lineTo(x, y);
  ctx.lineTo(x - s * Math.cos(a + .55), y - s * Math.sin(a + .55)); ctx.lineJoin = "round"; ctx.stroke(); }
function check(x, y, s, k, color = C.accent, lw = 5) { if (k <= 0) return; ctx.beginPath(); const p = [[x - s * .5, y], [x - s * .12, y + s * .38], [x + s * .55, y - s * .42]];
  ctx.moveTo(p[0][0], p[0][1]); const k1 = clamp01(k * 2), k2 = clamp01(k * 2 - 1);
  ctx.lineTo(lerp(p[0][0], p[1][0], k1), lerp(p[0][1], p[1][1], k1)); if (k2 > 0) ctx.lineTo(lerp(p[1][0], p[2][0], k2), lerp(p[1][1], p[2][1], k2));
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke(); }
function polyline(pts, k, color, lw) { if (k <= 0 || pts.length < 2) return; let L = 0; const d = [];
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); d.push(l); L += l; }
  let rem = L * k; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && rem > 0; i++) { const f = Math.min(1, rem / d[i - 1]); ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)); rem -= d[i - 1]; }
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.stroke(); }
function withAlpha(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= Math.min(1, a); fn(); ctx.restore(); }
// Grammaire d'apparition unique : fondu + montée de 16 px, easing doux
const enter = (lt, t0, d = .55) => EASE(seg(lt, t0, t0 + d));
function appear(k, fn, dy = 16) { if (k <= 0) return; ctx.save(); ctx.globalAlpha *= k; ctx.translate(0, (1 - k) * dy); fn(); ctx.restore(); }
function glitch(x, y, w, h, amp, t) {
  const r = rng(Math.floor(t * 18) * 7919 + 13); ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (let i = 0; i < 8; i++) { const sy = y + r() * h, sh = 6 + r() * 30, off = (r() - .5) * 2 * amp, hh = Math.min(sh, y + h - sy); if (hh <= 1) continue;
    ctx.drawImage(cv, (x - VIEW.x) * K, (sy - VIEW.y) * K, w * K, hh * K, (x + off - VIEW.x) * K, (sy - VIEW.y) * K, w * K, hh * K); }
  ctx.restore();

  try { await el.requestFullscreen(); if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape"); } catch (e) {} };
document.addEventListener("fullscreenchange", () => layout());
["pointermove", "pointerdown", "touchstart", "keydown"].forEach(ev => document.addEventListener(ev, poke, { passive:true }));
Object.keys(SCRIPT.acts).forEach((a, i) => { const li = document.createElement("li"), b = document.createElement("button");
  b.innerHTML = `<span class="t">${fmt(ACT_START[i])}</span><span>Acte ${a} · ${SCRIPT.acts[a]}</span>`;
  b.onclick = () => { started = true; $("bigplay").hidden = true; seek(ACT_START[i] + .01); if (!playing) play(); };
  li.appendChild(b); $("chapters").appendChild(li); });
const trackEl = $("track");
ACT_START.slice(1).forEach(s => { const m = document.createElement("div"); m.className = "mark"; m.style.left = (s / DUR * 100) + "%"; trackEl.appendChild(m); });
const tAt = e => { const r = trackEl.getBoundingClientRect(); return clamp01((e.clientX - r.left) / r.width) * DUR; };
trackEl.addEventListener("pointerdown", e => { trackEl.setPointerCapture(e.pointerId); started = true; $("bigplay").hidden = true; seek(tAt(e)); });
trackEl.addEventListener("pointermove", e => { const t = tAt(e), p = planAt(t); $("tip").textContent = `${fmt(t)} · ${SCRIPT.acts[p.act]}`; $("tip").style.left = (t / DUR * 100) + "%"; if (e.buttons) seek(t); });
document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.key === "k") { e.preventDefault(); if (!started) { T = 0; play(); } else toggle(); }
  else if (e.key === "ArrowRight") seek(T + 5); else if (e.key === "ArrowLeft") seek(T - 5); else if (e.key === "m") $("sound").click(); });
function layout() {
  PORTRAIT = matchMedia("(orientation: portrait) and (max-width: 760px)").matches && !document.fullscreenElement;
  VIEW = PORTRAIT ? { x:80, y:164, w:1760, h:692 } : { x:0, y:0, w:W, h:H };
  $("stage").style.aspectRatio = `${VIEW.w} / ${VIEW.h}`;
  const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.max(960, Math.min(1920, Math.round(r.width * dpr))); cv.height = Math.round(cv.width * VIEW.h / VIEW.w);
  render(T); ui();
}
window.addEventListener("resize", layout);
// Vérification : window.__seek(t) fige l'image à t secondes ; ?t=12 dans l'URL fait pareil.
window.__seek = t => { playing = false; started = true; $("bigplay").hidden = true; showHud(); seek(t); };
const POSTER = 7.5;
Promise.all([400, 600, 700, 800].map(w => document.fonts.load(`${w} 40px InterE`)).concat(document.fonts.load("400 40px MonoE"))).then(() => {
  layout(); const q = new URLSearchParams(location.search).get("t");
  if (q != null) window.__seek(parseFloat(q)); else { render(POSTER); T = 0; ui(); $("fill").style.width = "0%"; $("time").textContent = "0:00 / 1:00"; }
  window.__ready = true;
});
</script>
